<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:Arial,sans-serif;background:#f4f1ea;margin:0;padding:20px;color:#123f3a}
h1{font-size:1.2rem}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
canvas{width:120px;height:120px;border-radius:10px}button{background:#123f3a;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:1rem;cursor:pointer}
#st{font-size:.9rem;margin:8px 0}
</style></head><body>
<h1>Musaed icon maker</h1>
<div id="st">Loading the app font…</div>
<div id="list"></div>
<script>
const SPECS=[{file:'icon-192.png',size:192,frac:0.72},{file:'icon-512.png',size:512,frac:0.72},{file:'icon-512-maskable.png',size:512,frac:0.56},{file:'apple-touch-icon.png',size:180,frac:0.72}];
const TXT='مُسَاعِد';
function draw(c,spec){
  const S=spec.size;c.width=S;c.height=S;const x=c.getContext('2d');
  x.fillStyle='#123f3a';x.fillRect(0,0,S,S);
  x.direction='rtl';x.textAlign='center';x.textBaseline='alphabetic';
  let fs=100;x.font=`700 ${fs}px 'Aref Ruqaa', 'Amiri', serif`;
  const w=x.measureText(TXT).width;fs=Math.floor(fs*S*spec.frac/w);
  x.font=`700 ${fs}px 'Aref Ruqaa', 'Amiri', serif`;
  const m=x.measureText(TXT);
  const asc=m.actualBoundingBoxAscent,desc=m.actualBoundingBoxDescent;
  const y=S/2+(asc-desc)/2;
  const g=x.createLinearGradient(S*(1-spec.frac)/2,0,S*(1+spec.frac)/2,0);
  g.addColorStop(0,'#c9973a');g.addColorStop(0.5,'#f3e0ab');g.addColorStop(1,'#c9973a');
  x.fillStyle=g;x.fillText(TXT,S/2,y);
}
function dl(c,name){c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();},'image/png');}
(async()=>{
  let ok=false;
  try{const r=await document.fonts.load("700 100px 'Aref Ruqaa'",TXT);ok=r&&r.length>0;await document.fonts.ready;}catch(e){}
  document.getElementById('st').textContent=ok?'Font loaded. Tap each Download button (4 files).':'The app font did not load (check internet) — the icons below would use a fallback font. Reload this page with internet on.';
  const list=document.getElementById('list');
  SPECS.forEach(sp=>{
    const d=document.createElement('div');d.className='card';
    const c=document.createElement('canvas');draw(c,sp);
    const b=document.createElement('button');b.textContent='Download '+sp.file;b.onclick=()=>dl(c,sp.file);
    d.appendChild(c);d.appendChild(b);list.appendChild(d);
  });
})();
</script></body></html>
